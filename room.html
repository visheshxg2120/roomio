<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your Room — Move-in Checklist</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏠</text></svg>" />
<link rel="stylesheet" href="css/styles.css" />
<link rel="stylesheet" href="css/room.css" />
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="topbar-title">
      <span class="topbar-icon">🏠</span>
      <div>
        <h1>Your Room</h1>
        <p class="subtitle">Click a zone to check things off. Fills in as you go.</p>
      </div>
    </div>
    <div class="topbar-actions">
      <a href="index.html" class="btn btn-ghost">📋 Full checklist</a>
    </div>
  </header>

  <section class="summary" id="summary">
    <div class="summary-progress">
      <div class="summary-progress-top">
        <span id="summaryLabel">0 of 0 done</span>
        <span id="summaryPercent">0%</span>
      </div>
      <div class="progress-bar large">
        <div class="progress-bar-fill" id="summaryFill"></div>
      </div>
    </div>
  </section>

  <section class="room-stage" id="roomStage">
    <div id="roomCanvasWrap" class="room-canvas-wrap">
      <canvas id="roomCanvas"></canvas>
      <div id="roomLabels" class="room-labels"></div>
      <p id="roomLoading" class="room-loading">Building your room…</p>
    </div>
    <p class="room-hint">Drag to look around · scroll to zoom · click a zone to open its checklist</p>
  </section>

  <section class="more-categories">
    <h2 class="more-categories-title">Everything else</h2>
    <div class="chip-scroll" id="otherCategories"></div>
  </section>

</div>

<div class="panel-overlay" id="panelOverlay"></div>
<aside class="side-panel" id="sidePanel" aria-hidden="true">
  <div class="side-panel-header">
    <span class="side-panel-icon" id="panelIcon"></span>
    <div class="side-panel-header-text">
      <h2 id="panelTitle"></h2>
      <div class="card-progress-row">
        <div class="progress-bar small"><div class="progress-bar-fill" id="panelFill"></div></div>
        <span class="card-count" id="panelCount"></span>
      </div>
    </div>
    <button class="btn-close" id="panelClose" type="button" aria-label="Close">✕</button>
  </div>
  <ul class="item-list" id="panelItemList"></ul>
</aside>

<template id="itemRowTemplate">
  <li class="item-row">
    <label class="item-label">
      <input type="checkbox" class="item-checkbox" />
      <span class="item-text">
        <span class="item-name"></span>
        <span class="item-notes"></span>
      </span>
    </label>
    <span class="item-qty"></span>
    <span class="item-priority"></span>
  </li>
</template>

<template id="otherChipTemplate">
  <button class="other-chip" type="button">
    <span class="other-chip-icon"></span>
    <span class="other-chip-text">
      <span class="other-chip-name"></span>
      <span class="other-chip-count"></span>
    </span>
  </button>
</template>

<script src="js/vendor/three.min.js"></script>
<script src="js/vendor/OrbitControls.js"></script>
<script src="js/vendor/gsap.min.js"></script>
<script src="js/room.js"></script>
</body>
</html>
