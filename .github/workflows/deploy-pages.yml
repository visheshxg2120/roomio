# Requires GitHub Pages to be enabled once, manually, under
# Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
# The default GITHUB_TOKEN can't create the Pages site itself (403
# "Resource not accessible by integration" on the Pages API), only
# deploy to one that already exists.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/house-checklist-website-4ydeas
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stage site files
        run: |
          mkdir -p dist/css dist/js dist/data
          cp index.html dist/
          cp css/styles.css dist/css/
          cp js/app.js dist/js/
          cp data/checklist.json dist/data/

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
